name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify frontend Pages artifact
        run: |
          test -f frontend/index.html
          test -d frontend/pages
          test -d frontend/styles
          test -d frontend/assets
          test -f frontend/js/ews-nav.js

      - name: Verify backend SAM template present
        run: test -f backend/template.yaml

  sprint1-evidence-fixtures:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run Sprint 1 evidence fixture suite
        working-directory: backend
        run: npm run test:sprint1-evidence-fixtures
