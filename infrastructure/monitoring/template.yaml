  Ec2JobMonitoringDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub SISUM-${Environment}-EC2-Jobs
      DashboardBody: !Sub |
        {
          "start": "-PT24H",
          "periodOverride": "inherit",
          "widgets": [
            {
              "type": "text", "x": 0, "y": 0, "width": 24, "height": 2,
              "properties": { "markdown": "# EC2 asynchronous job operations\\n**Queue:** ${Ec2JobQueueName}  \\n**DLQ:** ${Ec2JobDeadLetterQueueName}  \\n**Worker:** ${Ec2JobWorkerFunctionName}" }
            },
            {
              "type": "metric", "x": 0, "y": 2, "width": 12, "height": 6,
              "properties": {
                "title": "Queue Depth and Oldest Message Age", "region": "${AWS::Region}", "view": "timeSeries", "period": 60,
                "metrics": [
                  [ "AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${Ec2JobQueueName}", { "stat": "Maximum", "label": "Queue Depth" } ],
                  [ ".", "ApproximateAgeOfOldestMessage", ".", ".", { "stat": "Maximum", "label": "Oldest Message Age (seconds)", "yAxis": "right" } ],
                  [ ".", "ApproximateNumberOfMessagesVisible", "QueueName", "${Ec2JobDeadLetterQueueName}", { "stat": "Maximum", "label": "DLQ Depth" } ]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 2, "width": 12, "height": 6,
              "properties": {
                "title": "Lambda Errors, Duration, and Throttles", "region": "${AWS::Region}", "view": "timeSeries", "period": 300,
                "metrics": [
                  [ "AWS/Lambda", "Errors", "FunctionName", "${Ec2JobWorkerFunctionName}", { "stat": "Sum", "label": "Errors" } ],
                  [ ".", "Duration", ".", ".", { "stat": "Average", "label": "Average Duration (ms)", "yAxis": "right" } ],
                  [ ".", "Throttles", ".", ".", { "stat": "Sum", "label": "Throttles" } ]
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 8, "width": 12, "height": 6,
              "properties": {
                "title": "Concurrent Executions", "region": "${AWS::Region}", "view": "timeSeries", "period": 60,
                "metrics": [
                  [ "AWS/Lambda", "ConcurrentExecutions", "FunctionName", "${Ec2JobWorkerFunctionName}", { "stat": "Maximum", "label": "Worker Concurrency" } ]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 8, "width": 12, "height": 6,
              "properties": {
                "title": "Job Lifecycle Events", "region": "${AWS::Region}", "view": "timeSeries", "period": 300, "stat": "Sum",
                "metrics": [
                  [ "SISUM/EC2Jobs", "JobQueued", { "label": "Queued" } ],
                  [ ".", "JobStarted", { "label": "Started" } ],
                  [ ".", "JobCompleted", { "label": "Completed" } ],
                  [ ".", "JobPartial", { "label": "Partial Success" } ],
                  [ ".", "JobFailed", { "label": "Failed" } ],
                  [ ".", "JobRetried", { "label": "Retried" } ]
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 14, "width": 12, "height": 6,
              "properties": {
                "title": "Job Success Rate", "region": "${AWS::Region}", "view": "singleValue", "period": 300,
                "metrics": [
                  [ "SISUM/EC2Jobs", "JobCompleted", { "id": "completed", "visible": false, "stat": "Sum" } ],
                  [ ".", "JobPartial", { "id": "partial", "visible": false, "stat": "Sum" } ],
                  [ ".", "JobFailed", { "id": "failed", "visible": false, "stat": "Sum" } ],
                  [ { "expression": "IF(completed + partial + failed > 0, 100 * (completed + partial) / (completed + partial + failed), 100)", "label": "Success Rate (%)", "id": "successRate" } ]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 14, "width": 12, "height": 6,
              "properties": {
                "title": "Retry Rate", "region": "${AWS::Region}", "view": "singleValue", "period": 300,
                "metrics": [
                  [ "SISUM/EC2Jobs", "JobRetried", { "id": "retries", "visible": false, "stat": "Sum" } ],
                  [ ".", "JobStarted", { "id": "started", "visible": false, "stat": "Sum" } ],
                  [ { "expression": "IF(started > 0, 100 * retries / started, 0)", "label": "Retry Rate (%)", "id": "retryRate" } ]
                ]
              }
            },
            {
              "type": "alarm", "x": 0, "y": 20, "width": 24, "height": 6,
              "properties": {
                "title": "EC2 Job Alarm Status",
                "alarms": [
                  "${Ec2JobDlqMessagesAlarm.Arn}", "${Ec2JobQueueAgeAlarm.Arn}", "${Ec2JobWorkerErrorsAlarm.Arn}",
                  "${Ec2JobRetryRateAlarm.Arn}", "${Ec2JobWorkerThrottlesAlarm.Arn}", "${Ec2JobTimeoutAlarm.Arn}"
                ]
              }
            }
          ]
        }

Outputs:
  DashboardName:
    Description: CloudWatch production operations dashboard name.
    Value: !Ref ProductionMonitoringDashboard

  DashboardUrl:
    Description: CloudWatch production operations dashboard URL.
    Value: !Sub
      - "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${Dashboard}"
      - Dashboard: !Ref ProductionMonitoringDashboard

  AlarmTopicArn:
    Description: SNS topic ARN used by production monitoring alarms.
    Value: !Ref MonitoringAlarmTopic

  LambdaErrorsAlarmName:
    Description: Lambda errors alarm name.
    Value: !Ref LambdaErrorsAlarm

  ApiGateway5xxAlarmName:
    Description: API Gateway 5xx alarm name.
    Value: !Ref ApiGateway5xxAlarm

  CloudFront5xxAlarmName:
    Description: CloudFront 5xx error-rate alarm name.
    Value: !Ref CloudFront5xxErrorRateAlarm

  Ec2JobDashboardName:
    Description: CloudWatch dashboard for asynchronous EC2 job operations.
    Value: !Ref Ec2JobMonitoringDashboard

  Ec2JobDlqMessagesAlarmName:
    Description: EC2 job dead-letter queue message alarm name.
    Value: !Ref Ec2JobDlqMessagesAlarm

  Ec2JobRetryRateAlarmName:
    Description: EC2 job retry rate alarm name.
    Value: !Ref Ec2JobRetryRateAlarm
