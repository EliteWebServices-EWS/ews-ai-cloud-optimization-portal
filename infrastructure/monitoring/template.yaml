AWSTemplateFormatVersion: "2010-09-09"

Description: >
  SISUM production monitoring and observability resources, including
  a CloudWatch dashboard, operational alarms, and an SNS notification topic.

Parameters:
  Environment:
    Type: String
    Default: production
    AllowedValues:
      - development
      - staging
      - production

  LambdaFunctionName:
    Type: String
    Default: sisum-backend-production
    Description: Production SISUM Lambda function name.

  HttpApiId:
    Type: String
    Default: zqe6cl0m15
    Description: Production API Gateway HTTP API identifier.

  HttpApiStage:
    Type: String
    Default: "$default"
    Description: API Gateway HTTP API stage name.

  CloudFrontDistributionId:
    Type: String
    Default: E88PZIPZ6DVL4
    Description: Production CloudFront distribution identifier.

  FrontendBucketName:
    Type: String
    Default: sisum-frontend-production-739275446782
    Description: Production frontend S3 bucket name.

  AuditTableName:
    Type: String
    Default: sisum-audit-production
    Description: DynamoDB audit table name for throttling alarms.

  Ec2JobQueueName:
    Type: String
    Default: sisum-ec2-intelligence-production
    Description: Name of the primary SQS queue used for asynchronous EC2 jobs.

  Ec2JobDeadLetterQueueName:
    Type: String
    Default: sisum-ec2-intelligence-dlq-production
    Description: Name of the SQS dead-letter queue used for failed EC2 jobs.

  Ec2JobProducerFunctionName:
    Type: String
    Default: sisum-backend-production
    Description: Lambda function that writes EC2 job.queued audit events.

  Ec2JobWorkerFunctionName:
    Type: String
    Default: sisum-ec2-job-worker-production
    Description: Lambda function that consumes asynchronous EC2 jobs.

  Ec2JobQueueAgeThresholdSeconds:
    Type: Number
    Default: 900
    MinValue: 60
    Description: Maximum permitted age of the oldest queued EC2 job.

  Ec2JobRetryRateThresholdPercent:
    Type: Number
    Default: 25
    MinValue: 1
    MaxValue: 100
    Description: Retry percentage that triggers an EC2 job reliability alarm.

  NotificationEmail:
    Type: String
    Default: ""
    Description: >
      Optional email address for alarm notifications. Leave empty to create
      the monitoring stack without an email subscription.

Conditions:
  HasNotificationEmail: !Not
    - !Equals
      - !Ref NotificationEmail
      - ""

Resources:
  MonitoringAlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub sisum-${Environment}-monitoring-alarms
      DisplayName: SISUM Production Alarms
      Tags:
        - Key: Project
          Value: SISUM
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  MonitoringEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasNotificationEmail
    Properties:
      Protocol: email
      Endpoint: !Ref NotificationEmail
      TopicArn: !Ref MonitoringAlarmTopic

  LambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub sisum-${Environment}-lambda-errors
      AlarmDescription: >
        SISUM production Lambda reported one or more errors within five minutes.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref LambdaFunctionName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MonitoringAlarmTopic
      OKActions:
        - !Ref MonitoringAlarmTopic
      Tags:
        - Key: Project
          Value: SISUM
        - Key: Environment
          Value: !Ref Environment

  LambdaThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub sisum-${Environment}-lambda-throttles
      AlarmDescription: >
        SISUM production Lambda was throttled one or more times within five minutes.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref LambdaFunctionName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MonitoringAlarmTopic
      OKActions:
        - !Ref MonitoringAlarmTopic
      Tags:
        - Key: Project
          Value: SISUM
        - Key: Environment
          Value: !Ref Environment

  LambdaDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub sisum-${Environment}-lambda-duration-high
      AlarmDescription: >
        SISUM Lambda average duration exceeded ten seconds for two consecutive periods.
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref LambdaFunctionName
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 10000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MonitoringAlarmTopic
      OKActions:
        - !Ref MonitoringAlarmTopic
      Tags:
        - Key: Project
          Value: SISUM
        - Key: Environment
          Value: !Ref Environment

  ApiGateway5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub sisum-${Environment}-api-5xx-errors
      AlarmDescription: >
        SISUM HTTP API returned one or more server errors within five minutes.
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref HttpApiId
        - Name: Stage
          Value: !Ref HttpApiStage
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MonitoringAlarmTopic
      OKActions:
        - !Ref MonitoringAlarmTopic
      Tags:
        - Key: Project
          Value: SISUM
        - Key: Environment
          Value: !Ref Environment

  ApiGatewayLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub sisum-${Environment}-api-latency-high
      AlarmDescription: >
        SISUM HTTP API average latency exceeded five seconds for two consecutive periods.
      Namespace: AWS/ApiGateway
      MetricName: Latency
      Dimensions:
        - Name: ApiId
          Value: !Ref HttpApiId
        - Name: Stage
          Value: !Ref HttpApiStage
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 5000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MonitoringAlarmTopic
      OKActions:
        - !Ref MonitoringAlarmTopic
      Tags:
        - Key: Project
          Value: SISUM
        - Key: Environment
          Value: !Ref Environment

  CloudFront5xxErrorRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub sisum-${Environment}-cloudfront-5xx-rate
      AlarmDescription: >
        SISUM CloudFront 5xx error rate exceeded one percent for five minutes.
      Namespace: AWS/CloudFront
      MetricName: 5xxErrorRate
      Dimensions:
        - Name: DistributionId
          Value: !Ref CloudFrontDistributionId
        - Name: Region
          Value: Global
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MonitoringAlarmTopic
      OKActions:
        - !Ref MonitoringAlarmTopic
      Tags:
        - Key: Project
          Value: SISUM
        - Key: Environment
          Value: !Ref Environment

  AuditPersistenceFailureMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Sub "/aws/lambda/${LambdaFunctionName}"
      FilterPattern: '{ $.eventName = "audit.persistence_failed" }'
      MetricTransformations:
        - MetricName: AuditPersistenceFailures
          MetricNamespace: SISUM/Audit
          MetricValue: "1"
          DefaultValue: 0

  AuditPersistenceFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub sisum-${Environment}-audit-persistence-failures
      AlarmDescription: >
        One or more audit persistence failures were logged within five minutes.
      Namespace: SISUM/Audit
      MetricName: AuditPersistenceFailures
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MonitoringAlarmTopic
      OKActions:
        - !Ref MonitoringAlarmTopic
      Tags:
        - Key: Project
          Value: SISUM
        - Key: Environment
          Value: !Ref Environment

  AuditTableThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub sisum-${Environment}-audit-table-throttles
      AlarmDescription: >
        DynamoDB audit table reported throttled requests within five minutes.
      Namespace: AWS/DynamoDB
      MetricName: ThrottledRequests
      Dimensions:
        - Name: TableName
          Value: !Ref AuditTableName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MonitoringAlarmTopic
      OKActions:
        - !Ref MonitoringAlarmTopic
      Tags:
        - Key: Project
          Value: SISUM
        - Key: Environment
          Value: !Ref Environment

  AuthorizationDenialMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Sub "/aws/lambda/${LambdaFunctionName}"
      FilterPattern: '{ ($.eventName = "authorization.denied") || ($.eventName = "identity.missing") || ($.eventName = "role.unrecognized") }'
      MetricTransformations:
        - MetricName: AuthorizationDenials
          MetricNamespace: SISUM/Security
          MetricValue: "1"
          DefaultValue: 0

  AuthorizationDenialAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub sisum-${Environment}-authorization-denials
      AlarmDescription: >
        Repeated authorization denials were logged within five minutes.
      Namespace: SISUM/Security
      MetricName: AuthorizationDenials
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 25
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MonitoringAlarmTopic
      OKActions:
        - !Ref MonitoringAlarmTopic
      Tags:
        - Key: Project
          Value: SISUM
        - Key: Environment
          Value: !Ref Environment

  TenantAccessDeniedMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Sub "/aws/lambda/${LambdaFunctionName}"
      FilterPattern: '{ $.eventName = "tenant.access_denied" }'
      MetricTransformations:
        - MetricName: TenantAccessDenied
          MetricNamespace: SISUM/Security
          MetricValue: "1"
          DefaultValue: 0

  TenantAccessDeniedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub sisum-${Environment}-tenant-access-denied
      AlarmDescription: >
        Five or more cross-tenant access denial events were logged within five minutes.
      Namespace: SISUM/Security
      MetricName: TenantAccessDenied
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MonitoringAlarmTopic
      OKActions:
        - !Ref MonitoringAlarmTopic
      Tags:
        - Key: Project
          Value: SISUM
        - Key: Environment
          Value: !Ref Environment

  ApiGatewayHigh4xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub sisum-${Environment}-api-high-4xx
      AlarmDescription: >
        SISUM HTTP API returned a sustained volume of 4xx responses, which may
        include throttling (429) and authentication failures.
      Namespace: AWS/ApiGateway
      MetricName: 4xx
      Dimensions:
        - Name: ApiId
          Value: !Ref HttpApiId
        - Name: Stage
          Value: !Ref HttpApiStage
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 100
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MonitoringAlarmTopic
      OKActions:
        - !Ref MonitoringAlarmTopic
      Tags:
        - Key: Project
          Value: SISUM
        - Key: Environment
          Value: !Ref Environment

  Ec2JobQueuedMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Sub "/aws/lambda/${Ec2JobProducerFunctionName}"
      FilterPattern: '{ $.eventName = "ec2.job_queued" }'
      MetricTransformations:
        - MetricName: JobQueued
          MetricNamespace: SISUM/EC2Jobs
          MetricValue: "1"
          DefaultValue: 0

  Ec2JobStartedMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Sub "/aws/lambda/${Ec2JobWorkerFunctionName}"
      FilterPattern: '{ $.eventName = "ec2.job_started" }'
      MetricTransformations:
        - MetricName: JobStarted
          MetricNamespace: SISUM/EC2Jobs
          MetricValue: "1"
          DefaultValue: 0

  Ec2JobRetryMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Sub "/aws/lambda/${Ec2JobWorkerFunctionName}"
      FilterPattern: '{ $.eventName = "ec2.job_retry" }'
      MetricTransformations:
        - MetricName: JobRetried
          MetricNamespace: SISUM/EC2Jobs
          MetricValue: "1"
          DefaultValue: 0

  Ec2JobPartialMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Sub "/aws/lambda/${Ec2JobWorkerFunctionName}"
      FilterPattern: '{ $.eventName = "ec2.job_partial" }'
      MetricTransformations:
        - MetricName: JobPartial
          MetricNamespace: SISUM/EC2Jobs
          MetricValue: "1"
          DefaultValue: 0

  Ec2JobFailedMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Sub "/aws/lambda/${Ec2JobWorkerFunctionName}"
      FilterPattern: '{ $.eventName = "ec2.job_failed" }'
      MetricTransformations:
        - MetricName: JobFailed
          MetricNamespace: SISUM/EC2Jobs
          MetricValue: "1"
          DefaultValue: 0

  Ec2JobCompletedMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Sub "/aws/lambda/${Ec2JobWorkerFunctionName}"
      FilterPattern: '{ $.eventName = "ec2.job_completed" }'
      MetricTransformations:
        - MetricName: JobCompleted
          MetricNamespace: SISUM/EC2Jobs
          MetricValue: "1"
          DefaultValue: 0

  Ec2JobDlqMovedMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Sub "/aws/lambda/${Ec2JobWorkerFunctionName}"
      FilterPattern: '{ $.eventName = "ec2.job_dlq_moved" }'
      MetricTransformations:
        - MetricName: JobDlqMoved
          MetricNamespace: SISUM/EC2Jobs
          MetricValue: "1"
          DefaultValue: 0

  Ec2JobRedriveCompletedMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Sub "/aws/lambda/${Ec2JobWorkerFunctionName}"
      FilterPattern: '{ $.eventName = "ec2.job_redrive_completed" }'
      MetricTransformations:
        - MetricName: JobRedriveCompleted
          MetricNamespace: SISUM/EC2Jobs
          MetricValue: "1"
          DefaultValue: 0

  Ec2JobTimeoutMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Sub "/aws/lambda/${Ec2JobWorkerFunctionName}"
      FilterPattern: '"Task timed out"'
      MetricTransformations:
        - MetricName: JobTimeouts
          MetricNamespace: SISUM/EC2Jobs
          MetricValue: "1"
          DefaultValue: 0

  Ec2JobDlqMessagesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub sisum-${Environment}-ec2-job-dlq-messages
      AlarmDescription: EC2 job dead-letter queue contains one or more messages.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !Ref Ec2JobDeadLetterQueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref MonitoringAlarmTopic]
      OKActions: [!Ref MonitoringAlarmTopic]

  Ec2JobQueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub sisum-${Environment}-ec2-job-queue-age
      AlarmDescription: The oldest EC2 job has exceeded the allowed queue age.
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !Ref Ec2JobQueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: !Ref Ec2JobQueueAgeThresholdSeconds
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref MonitoringAlarmTopic]
      OKActions: [!Ref MonitoringAlarmTopic]

  Ec2JobWorkerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub sisum-${Environment}-ec2-job-worker-errors
      AlarmDescription: EC2 job worker reported one or more Lambda errors.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref Ec2JobWorkerFunctionName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref MonitoringAlarmTopic]
      OKActions: [!Ref MonitoringAlarmTopic]

  Ec2JobWorkerThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub sisum-${Environment}-ec2-job-worker-throttles
      AlarmDescription: EC2 job worker was throttled one or more times.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref Ec2JobWorkerFunctionName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref MonitoringAlarmTopic]
      OKActions: [!Ref MonitoringAlarmTopic]

  Ec2JobTimeoutAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub sisum-${Environment}-ec2-job-worker-timeouts
      AlarmDescription: EC2 job worker timed out while processing a job.
      Namespace: SISUM/EC2Jobs
      MetricName: JobTimeouts
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref MonitoringAlarmTopic]
      OKActions: [!Ref MonitoringAlarmTopic]

  Ec2JobRetryRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub sisum-${Environment}-ec2-job-retry-rate
      AlarmDescription: EC2 job retries exceeded the permitted percentage of started jobs.
      Metrics:
        - Id: retries
          MetricStat:
            Metric:
              Namespace: SISUM/EC2Jobs
              MetricName: JobRetried
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: started
          MetricStat:
            Metric:
              Namespace: SISUM/EC2Jobs
              MetricName: JobStarted
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: retryRate
          Expression: "IF(started > 0, 100 * retries / started, 0)"
          Label: Retry rate
          ReturnData: true
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: !Ref Ec2JobRetryRateThresholdPercent
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref MonitoringAlarmTopic]
      OKActions: [!Ref MonitoringAlarmTopic]

  ProductionMonitoringDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub SISUM-${Environment}-Operations
      DashboardBody: !Sub |
        {
          "start": "-PT24H",
          "periodOverride": "inherit",
          "widgets": [
            {
              "type": "text",
              "x": 0,
              "y": 0,
              "width": 24,
              "height": 3,
              "properties": {
                "markdown": "# SISU'M Production Operations\n**Environment:** ${Environment}  \n**Website:** https://elitewebservices.org  \n**API ID:** ${HttpApiId}  \n**Lambda:** ${LambdaFunctionName}"
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 3,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Lambda Invocations and Errors",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stacked": false,
                "period": 300,
                "stat": "Sum",
                "metrics": [
                  [
                    "AWS/Lambda",
                    "Invocations",
                    "FunctionName",
                    "${LambdaFunctionName}",
                    {
                      "label": "Invocations"
                    }
                  ],
                  [
                    ".",
                    "Errors",
                    ".",
                    ".",
                    {
                      "label": "Errors"
                    }
                  ],
                  [
                    ".",
                    "Throttles",
                    ".",
                    ".",
                    {
                      "label": "Throttles"
                    }
                  ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 3,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Lambda Duration",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stacked": false,
                "period": 300,
                "stat": "Average",
                "yAxis": {
                  "left": {
                    "label": "Milliseconds",
                    "showUnits": false
                  }
                },
                "metrics": [
                  [
                    "AWS/Lambda",
                    "Duration",
                    "FunctionName",
                    "${LambdaFunctionName}",
                    {
                      "label": "Average Duration"
                    }
                  ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 9,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "API Gateway Requests and Errors",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stacked": false,
                "period": 300,
                "metrics": [
                  [
                    "AWS/ApiGateway",
                    "Count",
                    "ApiId",
                    "${HttpApiId}",
                    "Stage",
                    "${HttpApiStage}",
                    {
                      "stat": "Sum",
                      "label": "Requests"
                    }
                  ],
                  [
                    ".",
                    "4xx",
                    ".",
                    ".",
                    ".",
                    ".",
                    {
                      "stat": "Sum",
                      "label": "4xx Errors"
                    }
                  ],
                  [
                    ".",
                    "5xx",
                    ".",
                    ".",
                    ".",
                    ".",
                    {
                      "stat": "Sum",
                      "label": "5xx Errors"
                    }
                  ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 9,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "API Gateway Latency",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stacked": false,
                "period": 300,
                "stat": "Average",
                "metrics": [
                  [
                    "AWS/ApiGateway",
                    "Latency",
                    "ApiId",
                    "${HttpApiId}",
                    "Stage",
                    "${HttpApiStage}",
                    {
                      "label": "Total Latency"
                    }
                  ],
                  [
                    ".",
                    "IntegrationLatency",
                    ".",
                    ".",
                    ".",
                    ".",
                    {
                      "label": "Integration Latency"
                    }
                  ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 15,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "CloudFront Requests",
                "region": "us-east-1",
                "view": "timeSeries",
                "stacked": false,
                "period": 300,
                "stat": "Sum",
                "metrics": [
                  [
                    "AWS/CloudFront",
                    "Requests",
                    "DistributionId",
                    "${CloudFrontDistributionId}",
                    "Region",
                    "Global",
                    {
                      "label": "Requests"
                    }
                  ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 15,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "CloudFront Error and Cache Rates",
                "region": "us-east-1",
                "view": "timeSeries",
                "stacked": false,
                "period": 300,
                "stat": "Average",
                "yAxis": {
                  "left": {
                    "label": "Percent",
                    "showUnits": false
                  }
                },
                "metrics": [
                  [
                    "AWS/CloudFront",
                    "4xxErrorRate",
                    "DistributionId",
                    "${CloudFrontDistributionId}",
                    "Region",
                    "Global",
                    {
                      "label": "4xx Error Rate"
                    }
                  ],
                  [
                    ".",
                    "5xxErrorRate",
                    ".",
