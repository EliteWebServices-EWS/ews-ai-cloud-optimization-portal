AWSTemplateFormatVersion: "2010-09-09"

Description: >
  SISUM production monitoring and observability resources, including
  a CloudWatch dashboard, operational alarms, and an SNS notification topic.

Parameters:
  Environment:
    Type: String
    Default: production
    AllowedValues:
      - development
      - staging
      - production

  LambdaFunctionName:
    Type: String
    Default: sisum-backend-production
    Description: Production SISUM Lambda function name.

  HttpApiId:
    Type: String
    Default: zqe6cl0m15
    Description: Production API Gateway HTTP API identifier.

  HttpApiStage:
    Type: String
    Default: "$default"
    Description: API Gateway HTTP API stage name.

  CloudFrontDistributionId:
    Type: String
    Default: E88PZIPZ6DVL4
    Description: Production CloudFront distribution identifier.

  FrontendBucketName:
    Type: String
    Default: sisum-frontend-production-739275446782
    Description: Production frontend S3 bucket name.

  AuditTableName:
    Type: String
    Default: sisum-audit-production
    Description: DynamoDB audit table name for throttling alarms.

  NotificationEmail:
    Type: String
    Default: ""
    Description: >
      Optional email address for alarm notifications. Leave empty to create
      the monitoring stack without an email subscription.

  Ec2AnalysisConsumerFunctionName:
    Type: String
    Default: sisum-ec2-analysis-consumer-production
    Description: EC2 intelligence SQS consumer Lambda function name.

  Ec2IntelligenceQueueName:
    Type: String
    Default: sisum-ec2-intelligence-production
    Description: EC2 intelligence work queue name.

  Ec2IntelligenceDlqName:
    Type: String
    Default: sisum-ec2-intelligence-dlq-production
    Description: EC2 intelligence dead-letter queue name.

  Ec2QueueAgeAlarmThresholdSeconds:
    Type: Number
    Default: 900
    Description: >
      Oldest visible message age (seconds) on the work queue before alarming.
      Default 900s is above the 300s consumer timeout and below the 1800s
      visibility timeout to surface backlog/stall without treating normal
      in-flight work as an outage.

  Ec2JobRetryAlarmThresholdPercent:
    Type: Number
    Default: 25
    Description: >
      Alarm when retry intensity exceeds this value. Retry intensity is
      100 * (retry audit events / job started events) and can exceed 100
      when one job retries multiple times (not unique-job retry percentage).

  Ec2ConsumerNearTimeoutThresholdMilliseconds:
    Type: Number
    Default: 270000
    Description: >
      Maximum Lambda Duration statistic (milliseconds) before a near-timeout
      alarm fires for the EC2 consumer (300000 ms Lambda timeout).

Conditions:
  HasNotificationEmail: !Not
    - !Equals
      - !Ref NotificationEmail
      - ""

Resources:
  MonitoringAlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub sisum-${Environment}-monitoring-alarms
      DisplayName: SISUM Production Alarms
      Tags:
        - Key: Project
          Value: SISUM
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  MonitoringEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasNotificationEmail
    Properties:
      Protocol: email
      Endpoint: !Ref NotificationEmail
      TopicArn: !Ref MonitoringAlarmTopic

  LambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub sisum-${Environment}-lambda-errors
      AlarmDescription: >
        SISUM production Lambda reported one or more errors within five minutes.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref LambdaFunctionName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MonitoringAlarmTopic
      OKActions:
        - !Ref MonitoringAlarmTopic
      Tags:
        - Key: Project
          Value: SISUM
        - Key: Environment
          Value: !Ref Environment

  LambdaThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub sisum-${Environment}-lambda-throttles
      AlarmDescription: >
        SISUM production Lambda was throttled one or more times within five minutes.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref LambdaFunctionName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MonitoringAlarmTopic
      OKActions:
        - !Ref MonitoringAlarmTopic
      Tags:
        - Key: Project
          Value: SISUM
        - Key: Environment
          Value: !Ref Environment

  LambdaDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub sisum-${Environment}-lambda-duration-high
      AlarmDescription: >
        SISUM Lambda average duration exceeded ten seconds for two consecutive periods.
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref LambdaFunctionName
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 10000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MonitoringAlarmTopic
      OKActions:
        - !Ref MonitoringAlarmTopic
      Tags:
        - Key: Project
          Value: SISUM
        - Key: Environment
          Value: !Ref Environment

  ApiGateway5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub sisum-${Environment}-api-5xx-errors
      AlarmDescription: >
        SISUM HTTP API returned one or more server errors within five minutes.
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref HttpApiId
        - Name: Stage
          Value: !Ref HttpApiStage
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MonitoringAlarmTopic
      OKActions:
        - !Ref MonitoringAlarmTopic
      Tags:
        - Key: Project
          Value: SISUM
        - Key: Environment
          Value: !Ref Environment

  ApiGatewayLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub sisum-${Environment}-api-latency-high
      AlarmDescription: >
        SISUM HTTP API average latency exceeded five seconds for two consecutive periods.
      Namespace: AWS/ApiGateway
      MetricName: Latency
      Dimensions:
        - Name: ApiId
          Value: !Ref HttpApiId
        - Name: Stage
          Value: !Ref HttpApiStage
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 5000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MonitoringAlarmTopic
      OKActions:
        - !Ref MonitoringAlarmTopic
      Tags:
        - Key: Project
          Value: SISUM
        - Key: Environment
          Value: !Ref Environment

  CloudFront5xxErrorRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub sisum-${Environment}-cloudfront-5xx-rate
      AlarmDescription: >
        SISUM CloudFront 5xx error rate exceeded one percent for five minutes.
      Namespace: AWS/CloudFront
      MetricName: 5xxErrorRate
      Dimensions:
        - Name: DistributionId
          Value: !Ref CloudFrontDistributionId
        - Name: Region
          Value: Global
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MonitoringAlarmTopic
      OKActions:
        - !Ref MonitoringAlarmTopic
      Tags:
        - Key: Project
          Value: SISUM
        - Key: Environment
          Value: !Ref Environment

  AuditPersistenceFailureMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Sub "/aws/lambda/${LambdaFunctionName}"
      FilterPattern: '{ $.eventName = "audit.persistence_failed" }'
      MetricTransformations:
        - MetricName: AuditPersistenceFailures
          MetricNamespace: SISUM/Audit
          MetricValue: "1"
          DefaultValue: 0

  AuditPersistenceFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub sisum-${Environment}-audit-persistence-failures
      AlarmDescription: >
        One or more audit persistence failures were logged within five minutes.
      Namespace: SISUM/Audit
      MetricName: AuditPersistenceFailures
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MonitoringAlarmTopic
      OKActions:
        - !Ref MonitoringAlarmTopic
      Tags:
        - Key: Project
          Value: SISUM
        - Key: Environment
          Value: !Ref Environment

  AuditTableThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub sisum-${Environment}-audit-table-throttles
      AlarmDescription: >
        DynamoDB audit table reported throttled requests within five minutes.
      Namespace: AWS/DynamoDB
      MetricName: ThrottledRequests
      Dimensions:
        - Name: TableName
          Value: !Ref AuditTableName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MonitoringAlarmTopic
      OKActions:
        - !Ref MonitoringAlarmTopic
      Tags:
        - Key: Project
          Value: SISUM
        - Key: Environment
          Value: !Ref Environment

  AuthorizationDenialMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Sub "/aws/lambda/${LambdaFunctionName}"
      FilterPattern: '{ ($.eventName = "authorization.denied") || ($.eventName = "identity.missing") || ($.eventName = "role.unrecognized") }'
      MetricTransformations:
        - MetricName: AuthorizationDenials
          MetricNamespace: SISUM/Security
          MetricValue: "1"
          DefaultValue: 0

  AuthorizationDenialAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub sisum-${Environment}-authorization-denials
      AlarmDescription: >
        Repeated authorization denials were logged within five minutes.
      Namespace: SISUM/Security
      MetricName: AuthorizationDenials
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 25
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MonitoringAlarmTopic
      OKActions:
        - !Ref MonitoringAlarmTopic
      Tags:
        - Key: Project
          Value: SISUM
        - Key: Environment
          Value: !Ref Environment

  TenantAccessDeniedMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Sub "/aws/lambda/${LambdaFunctionName}"
      FilterPattern: '{ $.eventName = "tenant.access_denied" }'
      MetricTransformations:
        - MetricName: TenantAccessDenied
          MetricNamespace: SISUM/Security
          MetricValue: "1"
          DefaultValue: 0

  TenantAccessDeniedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub sisum-${Environment}-tenant-access-denied
      AlarmDescription: >
        Five or more cross-tenant access denial events were logged within five minutes.
      Namespace: SISUM/Security
      MetricName: TenantAccessDenied
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MonitoringAlarmTopic
      OKActions:
        - !Ref MonitoringAlarmTopic
      Tags:
        - Key: Project
          Value: SISUM
        - Key: Environment
          Value: !Ref Environment

  ApiGatewayHigh4xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub sisum-${Environment}-api-high-4xx
      AlarmDescription: >
        SISUM HTTP API returned a sustained volume of 4xx responses, which may
        include throttling (429) and authentication failures.
      Namespace: AWS/ApiGateway
      MetricName: 4xx
      Dimensions:
        - Name: ApiId
          Value: !Ref HttpApiId
        - Name: Stage
          Value: !Ref HttpApiStage
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 100
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MonitoringAlarmTopic
      OKActions:
        - !Ref MonitoringAlarmTopic
      Tags:
        - Key: Project
          Value: SISUM
        - Key: Environment
          Value: !Ref Environment

  Ec2AsyncJobStartedMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Sub "/aws/lambda/${Ec2AnalysisConsumerFunctionName}"
      FilterPattern: '{ $.eventName = "ec2.async_job_started" }'
      MetricTransformations:
        - MetricName: Ec2AsyncJobsStarted
          MetricNamespace: SISUM/EC2AsyncJobs
          MetricValue: "1"
          DefaultValue: 0

  Ec2AsyncJobSucceededMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Sub "/aws/lambda/${Ec2AnalysisConsumerFunctionName}"
      FilterPattern: '{ $.eventName = "ec2.async_job_succeeded" }'
      MetricTransformations:
        - MetricName: Ec2AsyncJobsSucceeded
          MetricNamespace: SISUM/EC2AsyncJobs
          MetricValue: "1"
          DefaultValue: 0

  Ec2AsyncJobFailedMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Sub "/aws/lambda/${Ec2AnalysisConsumerFunctionName}"
      FilterPattern: '{ $.eventName = "ec2.async_job_failed" }'
      MetricTransformations:
        - MetricName: Ec2AsyncJobsFailed
          MetricNamespace: SISUM/EC2AsyncJobs
          MetricValue: "1"
          DefaultValue: 0

  Ec2AsyncJobRetryMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Sub "/aws/lambda/${Ec2AnalysisConsumerFunctionName}"
      FilterPattern: '{ $.eventName = "ec2.async_job_retrying" }'
      MetricTransformations:
        - MetricName: Ec2AsyncJobRetries
          MetricNamespace: SISUM/EC2AsyncJobs
          MetricValue: "1"
          DefaultValue: 0

  Ec2IntelligenceDlqDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub sisum-${Environment}-ec2-intelligence-dlq-depth
      AlarmDescription: >
        EC2 intelligence DLQ contains one or more messages (automatic retries exhausted).
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !Ref Ec2IntelligenceDlqName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MonitoringAlarmTopic
      OKActions:
        - !Ref MonitoringAlarmTopic
      Tags:
        - Key: Project
          Value: SISUM
        - Key: Environment
          Value: !Ref Environment

  Ec2IntelligenceQueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub sisum-${Environment}-ec2-intelligence-queue-age
      AlarmDescription: >
        Oldest visible message on the EC2 intelligence work queue exceeded the
        configured age threshold (backlog or consumer stall).
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !Ref Ec2IntelligenceQueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: !Ref Ec2QueueAgeAlarmThresholdSeconds
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MonitoringAlarmTopic
      OKActions:
        - !Ref MonitoringAlarmTopic
      Tags:
        - Key: Project
          Value: SISUM
        - Key: Environment
          Value: !Ref Environment

  Ec2AnalysisConsumerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub sisum-${Environment}-ec2-analysis-consumer-errors
      AlarmDescription: >
        EC2 analysis consumer Lambda reported one or more execution errors within five minutes.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref Ec2AnalysisConsumerFunctionName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MonitoringAlarmTopic
      OKActions:
        - !Ref MonitoringAlarmTopic
      Tags:
        - Key: Project
          Value: SISUM
        - Key: Environment
          Value: !Ref Environment

  Ec2AnalysisConsumerThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub sisum-${Environment}-ec2-analysis-consumer-throttles
      AlarmDescription: >
        EC2 analysis consumer Lambda was throttled one or more times within five minutes.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref Ec2AnalysisConsumerFunctionName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MonitoringAlarmTopic
      OKActions:
        - !Ref MonitoringAlarmTopic
      Tags:
        - Key: Project
          Value: SISUM
        - Key: Environment
          Value: !Ref Environment

  Ec2AnalysisConsumerNearTimeoutAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub sisum-${Environment}-ec2-analysis-consumer-near-timeout
      AlarmDescription: >
        EC2 analysis consumer Lambda maximum duration exceeded the near-timeout
        threshold (does not prove a hard Lambda timeout; investigate long stages).
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref Ec2AnalysisConsumerFunctionName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: !Ref Ec2ConsumerNearTimeoutThresholdMilliseconds
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MonitoringAlarmTopic
      OKActions:
        - !Ref MonitoringAlarmTopic
      Tags:
        - Key: Project
          Value: SISUM
        - Key: Environment
          Value: !Ref Environment

  Ec2AsyncJobHighRetryRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub sisum-${Environment}-ec2-async-job-high-retry-rate
      AlarmDescription: >
        EC2 async job retry intensity (100 * retry events / starts) exceeded
        the configured threshold for two consecutive five-minute periods.
        Values above 100 are expected when jobs retry multiple times.
      Metrics:
        - Id: started
          MetricStat:
            Metric:
              Namespace: SISUM/EC2AsyncJobs
              MetricName: Ec2AsyncJobsStarted
            Period: 300
            Stat: Sum
        - Id: retries
          MetricStat:
            Metric:
              Namespace: SISUM/EC2AsyncJobs
              MetricName: Ec2AsyncJobRetries
            Period: 300
            Stat: Sum
        - Id: retryRate
          Expression: IF(started>0,100*retries/started,0)
          Label: RetryIntensityPer100Starts
          ReturnData: true
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: !Ref Ec2JobRetryAlarmThresholdPercent
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref MonitoringAlarmTopic
      OKActions:
        - !Ref MonitoringAlarmTopic
      Tags:
        - Key: Project
          Value: SISUM
        - Key: Environment
          Value: !Ref Environment

  ProductionMonitoringDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub SISUM-${Environment}-Operations
      DashboardBody: !Sub |
        {
          "start": "-PT24H",
          "periodOverride": "inherit",
          "widgets": [
            {
              "type": "text",
              "x": 0,
              "y": 0,
              "width": 24,
              "height": 3,
              "properties": {
                "markdown": "# SISU'M Production Operations\n**Environment:** ${Environment}  \n**Website:** https://elitewebservices.org  \n**API ID:** ${HttpApiId}  \n**Lambda:** ${LambdaFunctionName}"
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 3,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Lambda Invocations and Errors",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stacked": false,
                "period": 300,
                "stat": "Sum",
                "metrics": [
                  [
                    "AWS/Lambda",
                    "Invocations",
                    "FunctionName",
                    "${LambdaFunctionName}",
                    {
                      "label": "Invocations"
                    }
                  ],
                  [
                    ".",
                    "Errors",
                    ".",
                    ".",
                    {
                      "label": "Errors"
                    }
                  ],
                  [
                    ".",
                    "Throttles",
                    ".",
                    ".",
                    {
                      "label": "Throttles"
                    }
                  ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 3,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Lambda Duration",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stacked": false,
                "period": 300,
                "stat": "Average",
                "yAxis": {
                  "left": {
                    "label": "Milliseconds",
                    "showUnits": false
                  }
                },
                "metrics": [
                  [
                    "AWS/Lambda",
                    "Duration",
                    "FunctionName",
                    "${LambdaFunctionName}",
                    {
                      "label": "Average Duration"
                    }
                  ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 9,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "API Gateway Requests and Errors",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stacked": false,
                "period": 300,
                "metrics": [
                  [
                    "AWS/ApiGateway",
                    "Count",
                    "ApiId",
                    "${HttpApiId}",
                    "Stage",
                    "${HttpApiStage}",
                    {
                      "stat": "Sum",
                      "label": "Requests"
                    }
                  ],
                  [
                    ".",
                    "4xx",
                    ".",
                    ".",
                    ".",
                    ".",
                    {
                      "stat": "Sum",
                      "label": "4xx Errors"
                    }
                  ],
                  [
                    ".",
                    "5xx",
                    ".",
                    ".",
                    ".",
                    ".",
                    {
                      "stat": "Sum",
                      "label": "5xx Errors"
                    }
                  ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 9,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "API Gateway Latency",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stacked": false,
                "period": 300,
                "stat": "Average",
                "metrics": [
                  [
                    "AWS/ApiGateway",
                    "Latency",
                    "ApiId",
                    "${HttpApiId}",
                    "Stage",
                    "${HttpApiStage}",
                    {
                      "label": "Total Latency"
                    }
                  ],
                  [
                    ".",
                    "IntegrationLatency",
                    ".",
                    ".",
                    ".",
                    ".",
                    {
                      "label": "Integration Latency"
                    }
                  ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 15,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "CloudFront Requests",
                "region": "us-east-1",
                "view": "timeSeries",
                "stacked": false,
                "period": 300,
                "stat": "Sum",
                "metrics": [
                  [
                    "AWS/CloudFront",
                    "Requests",
                    "DistributionId",
                    "${CloudFrontDistributionId}",
                    "Region",
                    "Global",
                    {
                      "label": "Requests"
                    }
                  ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 15,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "CloudFront Error and Cache Rates",
                "region": "us-east-1",
                "view": "timeSeries",
                "stacked": false,
                "period": 300,
                "stat": "Average",
                "yAxis": {
                  "left": {
                    "label": "Percent",
                    "showUnits": false
                  }
                },
                "metrics": [
                  [
                    "AWS/CloudFront",
                    "4xxErrorRate",
                    "DistributionId",
                    "${CloudFrontDistributionId}",
                    "Region",
                    "Global",
                    {
                      "label": "4xx Error Rate"
                    }
                  ],
                  [
                    ".",
                    "5xxErrorRate",
                    ".",
                    ".",
                    ".",
                    ".",
                    {
                      "label": "5xx Error Rate"
                    }
                  ],
                  [
                    ".",
                    "CacheHitRate",
                    ".",
                    ".",
                    ".",
                    ".",
                    {
                      "label": "Cache Hit Rate"
                    }
                  ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 21,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "S3 Frontend Bucket Size",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stacked": false,
                "period": 86400,
                "stat": "Average",
                "metrics": [
                  [
                    "AWS/S3",
                    "BucketSizeBytes",
                    "BucketName",
                    "${FrontendBucketName}",
                    "StorageType",
                    "StandardStorage",
                    {
                      "label": "Bucket Size"
                    }
                  ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 21,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "S3 Frontend Object Count",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stacked": false,
                "period": 86400,
                "stat": "Average",
                "metrics": [
                  [
                    "AWS/S3",
                    "NumberOfObjects",
                    "BucketName",
                    "${FrontendBucketName}",
                    "StorageType",
                    "AllStorageTypes",
                    {
                      "label": "Objects"
                    }
                  ]
                ]
              }
            },
            {
              "type": "text",
              "x": 0,
              "y": 27,
              "width": 24,
              "height": 2,
              "properties": {
                "markdown": "## EC2 Async Intelligence Pipeline\n**Consumer:** ${Ec2AnalysisConsumerFunctionName}  \n**Work queue:** ${Ec2IntelligenceQueueName}  \n**DLQ:** ${Ec2IntelligenceDlqName}"
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 29,
              "width": 8,
              "height": 6,
              "properties": {
                "title": "EC2 Queue Depth",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stacked": false,
                "period": 300,
                "stat": "Maximum",
                "metrics": [
                  [
                    "AWS/SQS",
                    "ApproximateNumberOfMessagesVisible",
                    "QueueName",
                    "${Ec2IntelligenceQueueName}",
                    {
                      "label": "Work Queue Depth"
                    }
                  ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 8,
              "y": 29,
              "width": 8,
              "height": 6,
              "properties": {
                "title": "EC2 Oldest Message Age (Seconds)",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stacked": false,
                "period": 300,
                "stat": "Maximum",
                "yAxis": {
                  "left": {
                    "label": "Seconds",
                    "showUnits": false
                  }
                },
                "metrics": [
                  [
                    "AWS/SQS",
                    "ApproximateAgeOfOldestMessage",
                    "QueueName",
                    "${Ec2IntelligenceQueueName}",
                    {
                      "label": "Oldest Message Age"
                    }
                  ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 16,
              "y": 29,
              "width": 8,
              "height": 6,
              "properties": {
                "title": "EC2 DLQ Depth",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stacked": false,
                "period": 300,
                "stat": "Maximum",
                "metrics": [
                  [
                    "AWS/SQS",
                    "ApproximateNumberOfMessagesVisible",
                    "QueueName",
                    "${Ec2IntelligenceDlqName}",
                    {
                      "label": "DLQ Depth"
                    }
                  ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 35,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "EC2 Consumer Lambda Errors and Throttles",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stacked": false,
                "period": 300,
                "stat": "Sum",
                "metrics": [
                  [
                    "AWS/Lambda",
                    "Errors",
                    "FunctionName",
                    "${Ec2AnalysisConsumerFunctionName}",
                    {
                      "label": "Errors"
                    }
                  ],
                  [
                    ".",
                    "Throttles",
                    ".",
                    ".",
                    {
                      "label": "Throttles"
                    }
                  ],
                  [
                    ".",
                    "Invocations",
                    ".",
                    ".",
                    {
                      "label": "Invocations"
                    }
                  ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 35,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "EC2 Consumer Lambda Duration and Concurrency",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stacked": false,
                "period": 300,
                "metrics": [
                  [
                    "AWS/Lambda",
                    "Duration",
                    "FunctionName",
                    "${Ec2AnalysisConsumerFunctionName}",
                    {
                      "stat": "Average",
                      "label": "Average Duration (ms)"
                    }
                  ],
                  [
                    ".",
                    "Duration",
                    ".",
                    ".",
                    {
                      "stat": "Maximum",
                      "label": "Max Duration (ms)"
                    }
                  ],
                  [
                    ".",
                    "ConcurrentExecutions",
                    ".",
                    ".",
                    {
                      "stat": "Maximum",
                      "label": "Concurrent Executions"
                    }
                  ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 41,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "EC2 Job Success Rate % (terminal jobs only)",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stacked": false,
                "period": 300,
                "metrics": [
                  [
                    {
                      "expression": "IF(m2+m3>0,100*m2/(m2+m3),0)",
                      "label": "Success % when Succeeded+Failed > 0; else 0 (no terminal jobs)",
                      "id": "successRate"
                    }
                  ],
                  [
                    "SISUM/EC2AsyncJobs",
                    "Ec2AsyncJobsSucceeded",
                    {
                      "id": "m2",
                      "visible": false,
                      "stat": "Sum"
                    }
                  ],
                  [
                    ".",
                    "Ec2AsyncJobsFailed",
                    {
                      "id": "m3",
                      "visible": false,
                      "stat": "Sum"
                    }
                  ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 41,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "EC2 Retry Intensity (retries per 100 starts)",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stacked": false,
                "period": 300,
                "metrics": [
                  [
                    {
                      "expression": "IF(m1>0,100*m4/m1,0)",
                      "label": "100 * retry events / starts (can exceed 100)",
                      "id": "retryIntensity"
                    }
                  ],
                  [
                    "SISUM/EC2AsyncJobs",
                    "Ec2AsyncJobsStarted",
                    {
                      "id": "m1",
                      "visible": false,
                      "stat": "Sum"
                    }
                  ],
                  [
                    ".",
                    "Ec2AsyncJobRetries",
                    {
                      "id": "m4",
                      "visible": false,
                      "stat": "Sum"
                    }
                  ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 47,
              "width": 24,
              "height": 6,
              "properties": {
                "title": "EC2 Job Terminal Events (Counts)",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stacked": false,
                "period": 300,
                "stat": "Sum",
                "metrics": [
                  [
                    "SISUM/EC2AsyncJobs",
                    "Ec2AsyncJobsStarted",
                    {
                      "label": "Jobs Started"
                    }
                  ],
                  [
                    ".",
                    "Ec2AsyncJobsSucceeded",
                    {
                      "label": "Jobs Succeeded"
                    }
                  ],
                  [
                    ".",
                    "Ec2AsyncJobsFailed",
                    {
                      "label": "Jobs Failed (business)"
                    }
                  ],
                  [
                    ".",
                    "Ec2AsyncJobRetries",
                    {
                      "label": "Job Retry Events"
                    }
                  ]
                ]
              }
            },
            {
              "type": "alarm",
              "x": 0,
              "y": 53,
              "width": 24,
              "height": 6,
              "properties": {
                "title": "Production Alarm Status",
                "alarms": [
                  "${LambdaErrorsAlarm.Arn}",
                  "${LambdaThrottlesAlarm.Arn}",
                  "${LambdaDurationAlarm.Arn}",
                  "${ApiGateway5xxAlarm.Arn}",
                  "${ApiGatewayLatencyAlarm.Arn}",
                  "${ApiGatewayHigh4xxAlarm.Arn}",
                  "${CloudFront5xxErrorRateAlarm.Arn}",
                  "${AuditPersistenceFailureAlarm.Arn}",
                  "${AuditTableThrottleAlarm.Arn}",
                  "${AuthorizationDenialAlarm.Arn}",
                  "${TenantAccessDeniedAlarm.Arn}",
                  "${Ec2IntelligenceDlqDepthAlarm.Arn}",
                  "${Ec2IntelligenceQueueAgeAlarm.Arn}",
                  "${Ec2AnalysisConsumerErrorsAlarm.Arn}",
                  "${Ec2AnalysisConsumerThrottlesAlarm.Arn}",
                  "${Ec2AnalysisConsumerNearTimeoutAlarm.Arn}",
                  "${Ec2AsyncJobHighRetryRateAlarm.Arn}"
                ]
              }
            }
          ]
        }

Outputs:
  DashboardName:
    Description: CloudWatch production operations dashboard name.
    Value: !Ref ProductionMonitoringDashboard

  DashboardUrl:
    Description: CloudWatch production operations dashboard URL.
    Value: !Sub
      - "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${Dashboard}"
      - Dashboard: !Ref ProductionMonitoringDashboard

  AlarmTopicArn:
    Description: SNS topic ARN used by production monitoring alarms.
    Value: !Ref MonitoringAlarmTopic

  LambdaErrorsAlarmName:
    Description: Lambda errors alarm name.
    Value: !Ref LambdaErrorsAlarm

  ApiGateway5xxAlarmName:
    Description: API Gateway 5xx alarm name.
    Value: !Ref ApiGateway5xxAlarm

  CloudFront5xxAlarmName:
    Description: CloudFront 5xx error-rate alarm name.
    Value: !Ref CloudFront5xxErrorRateAlarm
