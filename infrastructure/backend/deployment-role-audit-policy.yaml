AWSTemplateFormatVersion: "2010-09-09"

Description: >
  Supplemental IAM permissions for SisumBackendDeployRole so GitHub Actions
  can deploy SISU'M audit, tenant registry DynamoDB, and EC2 intelligence
  SQS resources through CloudFormation. EC2 analysis consumer execution-role
  deploy permissions are in a separate inline policy resource in this stack.
  Apply with an administrator role before re-running the backend deployment.

Parameters:
  BackendDeployRoleName:
    Type: String
    Default: SisumBackendDeployRole
    Description: GitHub OIDC backend deployment role name.

  LambdaExecutionRoleName:
    Type: String
    Default: SisumLambdaExecutionRole
    Description: Lambda execution role that receives the audit table policy.

  Ec2AnalysisConsumerExecutionRoleName:
    Type: String
    Default: SisumEc2AnalysisConsumerExecutionRole
    Description: >
      Dedicated Lambda execution role for the EC2 intelligence SQS consumer
      (Sprint 15 Engineer 2).

Resources:
  SisumBackendDeployAuditPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: SisumBackendDeployAuditResources
      Roles:
        - !Ref BackendDeployRoleName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ManageSisumDynamoDbTables
            Effect: Allow
            Action:
              - dynamodb:CreateTable
              - dynamodb:UpdateTable
              - dynamodb:DeleteTable
              - dynamodb:DescribeTable
              - dynamodb:DescribeTimeToLive
              - dynamodb:UpdateTimeToLive
              - dynamodb:TagResource
              - dynamodb:UntagResource
              - dynamodb:ListTagsOfResource
              - dynamodb:DescribeContinuousBackups
              - dynamodb:UpdateContinuousBackups
            Resource:
              - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/sisum-audit-*
              - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/sisum-workflows-*
              - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/sisum-reports-*
              - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/sisum-learning-*
              - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/sisum-verifications-*
              - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/sisum-ownership-*
              - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/sisum-tenants-*
              - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/sisum-memberships-*
              - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/sisum-invitations-*
              - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/sisum-execution-plans-*
              - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/sisum-aws-accounts-*
              - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/sisum-cloud-resources-*
              - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/sisum-async-jobs-*

          - Sid: ManageSisumEc2IntelligenceQueues
            Effect: Allow
            Action:
              - sqs:CreateQueue
              - sqs:DeleteQueue
              - sqs:GetQueueAttributes
              - sqs:SetQueueAttributes
              - sqs:GetQueueUrl
              - sqs:TagQueue
              - sqs:UntagQueue
              - sqs:ListQueueTags
            Resource:
              - !Sub arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:sisum-ec2-intelligence-*

          - Sid: ManageAuditLambdaExecutionPolicy
            Effect: Allow
            Action:
              - iam:CreatePolicy
              - iam:DeletePolicy
              - iam:GetPolicy
              - iam:GetPolicyVersion
              - iam:ListPolicyVersions
              - iam:CreatePolicyVersion
              - iam:DeletePolicyVersion
              - iam:AttachRolePolicy
              - iam:DetachRolePolicy
            Resource:
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/sisum-audit-dynamodb-*
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${LambdaExecutionRoleName}

  SisumBackendDeployConsumerExecutionRolePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: SisumBackendDeployConsumerExecutionRole
      Roles:
        - !Ref BackendDeployRoleName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ManageSisumEc2AnalysisConsumerExecutionRole
            Effect: Allow
            Action:
              - iam:CreateRole
              - iam:GetRole
              - iam:DeleteRole
              - iam:UpdateAssumeRolePolicy
              - iam:AttachRolePolicy
              - iam:DetachRolePolicy
              - iam:ListAttachedRolePolicies
              - iam:TagRole
              - iam:UntagRole
              - iam:ListRoleTags
            Resource:
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${Ec2AnalysisConsumerExecutionRoleName}

          - Sid: ManageSisumEc2AnalysisConsumerExecutionRoleInlinePolicies
            Effect: Allow
            Action:
              - iam:PutRolePolicy
              - iam:GetRolePolicy
              - iam:DeleteRolePolicy
              - iam:ListRolePolicies
            Resource:
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${Ec2AnalysisConsumerExecutionRoleName}

          - Sid: PassSisumEc2AnalysisConsumerExecutionRoleToLambda
            Effect: Allow
            Action:
              - iam:PassRole
            Resource:
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${Ec2AnalysisConsumerExecutionRoleName}
            Condition:
              StringEquals:
                iam:PassedToService: lambda.amazonaws.com

          - Sid: ManageSisumEc2AnalysisConsumerEventSourceMapping
            Effect: Allow
            Action:
              - lambda:CreateEventSourceMapping
              - lambda:UpdateEventSourceMapping
              - lambda:DeleteEventSourceMapping
            Resource: "*"
            Condition:
              StringLike:
                lambda:FunctionArn: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:sisum-ec2-analysis-consumer-*

          - Sid: ReadSisumEc2AnalysisConsumerEventSourceMappings
            Effect: Allow
            Action:
              - lambda:GetEventSourceMapping
              - lambda:ListEventSourceMappings
            Resource: "*"

Outputs:
  BackendDeployAuditPolicyName:
    Description: Supplemental deploy policy attached to SisumBackendDeployRole.
    Value: SisumBackendDeployAuditResources
  BackendDeployConsumerExecutionRolePolicyName:
    Description: >
      Consumer execution role deploy permissions on SisumBackendDeployRole.
      Does not replace SisumBackendDeployAuditResources.
    Value: SisumBackendDeployConsumerExecutionRole
